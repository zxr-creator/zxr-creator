<text class="sans" x="28" y="90" font-size="32" font-weight="700" letter-spacing="-1" fill="#0a0a0a">LTSM-Bundle</text>
<rect x="460" y="26" width="112" height="26" rx="13" fill="#fafafa" stroke="#d9d9d9" stroke-opacity="1"/>
<text class="mono" x="516" y="43.5" font-size="13" text-anchor="middle" fill="#4d4d4d">contributor</text>
<text class="sans" font-size="17" fill="#4d4d4d"><tspan x="28" y="124">A toolbox and benchmark for training large language</tspan><tspan x="28" y="148">models on time-series forecasting.</tspan></text>
<rect x="28" y="170" width="544" height="92" rx="10" fill="#fafafa" stroke="#ebebeb"/>
<rect x="29" y="171" width="542" height="90" rx="9" fill="url(#dots)"/>
