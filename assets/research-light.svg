<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="344" viewBox="0 0 1200 344" role="img" aria-label="Research areas: efficient model architecture, ML systems, recursive self-improvement">
<title>Research areas: efficient model architecture, ML systems, recursive self-improvement</title>
<style>
.sans{font-family:Geist, Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes cyc{0%,30%{opacity:1}34%,100%{opacity:0}}
@keyframes draw{0%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
@keyframes fill{0%,40%{opacity:0}60%,100%{opacity:1}}
@keyframes pop{0%,52%{opacity:0}60%,100%{opacity:1}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.f{opacity:0;animation:cyc 6s linear infinite} .f1{opacity:1} .f2{animation-delay:2s} .f3{animation-delay:4s}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 6s ease-out infinite}
.area{animation:fill 6s ease-out infinite} .pop{animation:pop 6s ease-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes grow{0%,15%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes shrink{0%,15%{transform:scaleX(1)}60%,100%{transform:scaleX(.36)}}
@keyframes flow{to{stroke-dashoffset:-20}}
.caret{animation:blink 1.1s step-end infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s ease-in-out infinite alternate}
.shrink{transform-box:fill-box;transform-origin:left center;animation:shrink 6s ease-in-out infinite alternate}
.flow{stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="rgba(10,10,10,0.09)"/></pattern></defs>

<rect width="1200" height="344" fill="#ffffff" fill-opacity="0"/>
<path d="M12 40V32H372V40" fill="none" stroke="#d9d9d9"/><rect x="146.9" y="22" width="90.2" height="20" fill="#ffffff"/><text class="mono" x="192.0" y="36" font-size="12" letter-spacing="1" text-anchor="middle" fill="#8f8f8f">the model</text>
<path d="M420 40V32H1188V40" fill="none" stroke="#d9d9d9"/><rect x="700.4" y="22" width="207.2" height="20" fill="#ffffff"/><text class="mono" x="804.0" y="36" font-size="12" letter-spacing="1" text-anchor="middle" fill="#8f8f8f">machine learning systems</text>
<rect x="0.5" y="52.5" width="383" height="288" rx="14" fill="#ffffff" stroke="#ebebeb" stroke-opacity="1"/>
<text class="mono" x="28" y="88" font-size="12.5"><tspan fill="#2450e6" font-weight="600">01</tspan><tspan fill="#8f8f8f" dx="10">efficient model architecture</tspan></text>
<rect x="320" y="70" width="7" height="7" rx="1.5" fill="#2450e6"/><rect x="320" y="79" width="7" height="7" rx="1.5" fill="#2450e6"/><rect x="329" y="79" width="7" height="7" rx="1.5" fill="#2450e6"/><rect x="320" y="88" width="7" height="7" rx="1.5" fill="#2450e6"/><rect x="329" y="88" width="7" height="7" rx="1.5" fill="#e3e3e3"/><rect x="338" y="88" width="7" height="7" rx="1.5" fill="#2450e6"/><rect x="320" y="97" width="7" height="7" rx="1.5" fill="#2450e6"/><rect x="329" y="97" width="7" height="7" rx="1.5" fill="#2450e6"/><rect x="338" y="97" width="7" height="7" rx="1.5" fill="#e3e3e3"/><rect x="347" y="97" width="7" height="7" rx="1.5" fill="#2450e6"/>
<text class="sans" x="28" y="126" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#0a0a0a">Compute less, by design</text>
<text class="sans" font-size="14.5" fill="#4d4d4d"><tspan x="28" y="158">Model and attention designs that skip work</tspan><tspan x="28" y="179">the model never needed: sparse attention for</tspan><tspan x="28" y="200">long-context and block-diffusion decoding,</tspan><tspan x="28" y="221">and redundancy-aware parallel decoding for</tspan><tspan x="28" y="242">diffusion language models.</tspan></text>
<line x1="28" y1="266" x2="356" y2="266" stroke="#ebebeb"/>
<text class="sans" x="28" y="303" font-size="30" font-weight="700" letter-spacing="-1" fill="#2450e6">5.53×</text>
<text class="mono" font-size="11.5" fill="#4d4d4d"><tspan x="130" y="290">faster sparse attention</tspan><tspan x="130" y="306" fill="#8f8f8f">at 128K context · RISA</tspan></text>
<text class="mono" x="28" y="328" font-size="11" fill="#8f8f8f">RISA · R²-dLLM · Vortex</text>
<rect x="408.5" y="52.5" width="383" height="288" rx="14" fill="#ffffff" stroke="#ebebeb" stroke-opacity="1"/>
<text class="mono" x="436" y="88" font-size="12.5"><tspan fill="#2450e6" font-weight="600">02</tspan><tspan fill="#8f8f8f" dx="10">ml systems</tspan></text>
<rect x="728" y="76" width="34" height="22" rx="4" fill="none" stroke="#8f8f8f" stroke-width="1.5"/><rect x="735" y="82" width="10" height="10" rx="2" fill="#2450e6"/><line x1="749.0" y1="81" x2="749.0" y2="93" stroke="#8f8f8f" stroke-width="1.2"/><line x1="752.5" y1="81" x2="752.5" y2="93" stroke="#8f8f8f" stroke-width="1.2"/><line x1="756.0" y1="81" x2="756.0" y2="93" stroke="#8f8f8f" stroke-width="1.2"/><line x1="759.5" y1="81" x2="759.5" y2="93" stroke="#8f8f8f" stroke-width="1.2"/><line x1="733" y1="98" x2="733" y2="102" stroke="#8f8f8f" stroke-width="1.5"/><line x1="740" y1="98" x2="740" y2="102" stroke="#8f8f8f" stroke-width="1.5"/><line x1="747" y1="98" x2="747" y2="102" stroke="#8f8f8f" stroke-width="1.5"/><line x1="754" y1="98" x2="754" y2="102" stroke="#8f8f8f" stroke-width="1.5"/>
<text class="sans" x="436" y="126" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#0a0a0a">Make it fast on real GPUs</text>
<text class="sans" font-size="14.5" fill="#4d4d4d"><tspan x="436" y="158">Serving engines, sequence parallelism,</tspan><tspan x="436" y="179">SLO-aware GPU scheduling and inference</tspan><tspan x="436" y="200">pipelines for LLMs and diffusion models,</tspan><tspan x="436" y="221">built and measured on real clusters,</tspan><tspan x="436" y="242">from H200s down to PCIe GPUs.</tspan></text>
<line x1="436" y1="266" x2="764" y2="266" stroke="#ebebeb"/>
<text class="sans" x="436" y="303" font-size="30" font-weight="700" letter-spacing="-1" fill="#2450e6">3.46×</text>
<text class="mono" font-size="11.5" fill="#4d4d4d"><tspan x="538" y="290">serving throughput</tspan><tspan x="538" y="306" fill="#8f8f8f">vs. full attention · Vortex</tspan></text>
<text class="mono" x="436" y="328" font-size="11" fill="#8f8f8f">Vortex · GenServe · SparSP · QRMark</text>
<rect x="816.5" y="52.5" width="383" height="288" rx="14" fill="#ffffff" stroke="#2450e6" stroke-opacity="0.6"/>
<text class="mono" x="844" y="88" font-size="12.5"><tspan fill="#2450e6" font-weight="600">03</tspan><tspan fill="#8f8f8f" dx="10">recursive self-improvement</tspan></text>
<path d="M1144 72h18l8 15-8 15h-18l-8-15z" fill="none" stroke="#2450e6" stroke-width="1.5" stroke-linejoin="round"/><rect x="1146.0" y="88" width="3.6" height="5" rx="1" fill="#2450e6"/><rect x="1151.5" y="84" width="3.6" height="9" rx="1" fill="#2450e6"/><rect x="1157.0" y="80" width="3.6" height="13" rx="1" fill="#2450e6"/>
<text class="sans" x="844" y="126" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#0a0a0a">Let agents build the system</text>
<text class="sans" font-size="14.5" fill="#4d4d4d"><tspan x="844" y="158">Agents that do systems work themselves:</tspan><tspan x="844" y="179">build LLM serving engines from scratch,</tspan><tspan x="844" y="200">compress models under a storage budget,</tspan><tspan x="844" y="221">write sparse-attention algorithms. I build</tspan><tspan x="844" y="242">the substrates and benchmarks to measure it.</tspan></text>
<line x1="844" y1="266" x2="1172" y2="266" stroke="#ebebeb"/>
<text class="sans" x="844" y="303" font-size="30" font-weight="700" letter-spacing="-1" fill="#2450e6">4.87×</text>
<text class="mono" font-size="11.5" fill="#4d4d4d"><tspan x="946" y="290">vs. the vLLM reference</tspan><tspan x="946" y="306" fill="#8f8f8f">agent-built server · ServerBench</tspan></text>
<text class="mono" x="844" y="328" font-size="11" fill="#8f8f8f">ServerBench · CompressionBench · Vortex</text>
</svg>
