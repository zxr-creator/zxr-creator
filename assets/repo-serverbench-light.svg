<text class="mono" x="504" y="43.5" font-size="13" text-anchor="middle" fill="#2450e6">lead developer</text>
<text class="sans" font-size="17" fill="#4d4d4d"><tspan x="28" y="124">Coding agents evolve a minimal server into a specialized</tspan><tspan x="28" y="148">LLM serving system, graded by a verifier they never see.</tspan></text>
