<path d="M30 30h11a3 3 0 0 1 3 3v16H33a3 3 0 0 0-3 3z M30 30v22" fill="none" stroke="#8f8f8f" stroke-width="1.6" stroke-linejoin="round"/>
<text class="mono" x="54" y="45" font-size="14" fill="#8f8f8f">Infini-AI-Lab/Server-Bench</text>
<text class="sans" x="28" y="90" font-size="32" font-weight="700" letter-spacing="-1" fill="#0a0a0a">ServerBench</text>
